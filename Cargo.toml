[workspace]
resolver = "2"
members = [
    "crates/*",
    "bin/*"
]

[workspace.dependencies]
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
figment = { version = "0.10", features = ["env", "toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.21.0", features = ["v4"] }

syntropy-core = { path = "crates/syntropy-core" }
syntropy-protocols = { path = "crates/syntropy-protocols" }
syntropy-memory = { path = "crates/syntropy-memory" }
syntropy-tools = { path = "crates/syntropy-tools" }
syntropy-multimodal = { path = "crates/syntropy-multimodal" }
syntropy-engine = { path = "crates/syntropy-engine" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
